# Win-Assistant Configuration Template
# Rename this file to config.toml or create config.toml next to win-assistant.exe

[api]
# Get your free key at https://aistudio.google.com/app/apikey
api_key = "YOUR_GEMINI_API_KEY_HERE"

# Optional backup key (automatically activated if main key hits rate limits)
backup_api_key = ""

# Verified fast multimodal model
model = "gemini-flash-latest"

[window]
width = 860
height = 500
opacity_percent = 92
top_offset = 24
font_size = 13.5
font_family = "Consolas"

[behavior]
follow_mouse = false
smooth_scrolling = true
auto_clear_on_scan = false

[hotkeys]
capture_screen = "Alt+Q"
analyze_clipboard = "Alt+W"
clear_history = "Alt+C"
toggle_follow = "Alt+F"
cycle_presets = "Alt+M"
toggle_visibility = "Alt+S"
scroll_up = "Alt+Up"
scroll_down = "Alt+Down"
opacity_dec = "Alt+Left"
opacity_inc = "Alt+Right"
width_dec = "Alt+["
width_inc = "Alt+]"
height_dec = "Alt+-"
height_inc = "Alt+="
panic_exit = "Alt+Shift+X"
